plugins {
    id 'java'
    id 'org.springframework.boot' version '3.0.1'
    id 'io.spring.dependency-management' version '1.1.0'
}

group = 'mx.com.pal'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// === AGREGA ESTO PARA CONFIGURAR EL REPOSITORIO ===
repositories {
    // Repositorio Maven Central
    mavenCentral()

    // Si necesitas repositorio personalizado (descomenta si es necesario)
    /*
    maven {
        credentials {
            username project.findProperty("repoUser") ?: ""
            password project.findProperty("repoPassword") ?: ""
        }
        url project.findProperty("repoCentral") ?: "https://repo.maven.apache.org/maven2"
    }
    */
}

ext {
    set('springCloudVersion', "2022.0.0")
    set('mapstructVersion', "1.5.3.Final")
    set('sleuthVersion', "3.1.5")
    set('oauth2AuthClientVersion', "1.0.0")
    set('reactiveFeign', "4.0.1")
    set('mysqlVersion', "8.0.32")
    set('iban4jVersion', "3.2.1")
    set('stripeVersion', "23.4.0")
    set('springCloudAwsVersion', "3.0.0")
    set("keycloakVersion", "23.0.4")
    set('micrometerTracingVersion', "1.2.0")
}

dependencies {
    // Dependencias de Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-reactor-netty'

    // Spring dependencies
    implementation 'org.springframework.data:spring-data-jpa'
    implementation 'org.springframework.security:spring-security-data'
    implementation 'org.springframework.security:spring-security-config'

    // Spring Cloud
    implementation "org.springframework.cloud:spring-cloud-starter-openfeign"
    implementation "org.springframework.cloud:spring-cloud-starter-sleuth:${sleuthVersion}"

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // OAuth2
    implementation('org.springframework.boot:spring-boot-starter-oauth2-client')
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-oauth2-resource-server', version: '3.0.0'

    // Apache Commons
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.12.0'
    implementation group: 'commons-validator', name: 'commons-validator', version: '1.7'

    // Database
    implementation 'org.liquibase:liquibase-core'
    implementation group: 'mysql', name: 'mysql-connector-java', version: "${mysqlVersion}"

    // Netty
    implementation 'io.projectreactor.netty:reactor-netty-http'
    implementation 'io.netty:netty-handler'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'

    // === COMENTA ESTAS DEPENDENCIAS TEMPORALMENTE ===
    //implementation "mx.com.pal:commons"      // <-- COMENTA ESTA
    //implementation "mx.com.pal:entities"     // <-- COMENTA ESTA
    //implementation "mx.com.pal.wallet:invoices"  // <-- COMENTA ESTA

    // Keycloak
    implementation "org.keycloak:keycloak-spring-boot-starter:${keycloakVersion}"
    implementation "org.keycloak:keycloak-admin-client:${keycloakVersion}"

    // MapStruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    implementation 'com.google.code.gson:gson:2.10.1'

    // Documentation
    implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.0.2'

    // Excel/PDF processing
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'org.apache.xmlbeans:xmlbeans:5.1.1'

    // Email
    implementation group: 'com.sun.mail', name: 'javax.mail', version: '1.5.5'
    implementation group: 'org.springframework', name: 'spring-support', version: '2.0.8'
    implementation group: 'org.thymeleaf', name: 'thymeleaf', version: '3.0.11.RELEASE'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    // Servlet
    compileOnly group: 'javax.servlet', name: 'javax.servlet-api', version: '4.0.1'

    // Processors
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor('org.hibernate:hibernate-jpamodelgen:5.3.28.Final')
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    // AWS
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'

    // Tracing
    implementation "io.micrometer:micrometer-tracing-bom:${micrometerTracingVersion}"
    implementation 'io.micrometer:micrometer-tracing'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'

    // Google APIs
    implementation 'com.google.api-client:google-api-client:2.0.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20220815-2.0.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.3.0'
    implementation "org.iban4j:iban4j:${iban4jVersion}"
    implementation 'com.google.maps:google-maps-services:2.2.0'

    // Slack
    implementation("com.slack.api:slack-api-client:1.42.0")

    // XML/Web Services
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'com.sun.xml.bind:jaxb-impl:2.3.1'
    implementation 'org.javassist:javassist:3.25.0-GA'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:3.0.0'
    implementation 'javax.xml.ws:jaxws-api:2.3.1'
    implementation 'com.sun.xml.ws:rt:2.3.1'
    implementation 'com.sun.xml.messaging.saaj:saaj-impl:1.5.1'

    // QR Code
    implementation 'com.google.zxing:core:3.3.3'
    implementation 'com.google.zxing:javase:1.7'

    // Graphics
    implementation group: 'fr.avianey.apache-xmlgraphics', name: 'batik', version: '1.8'
    implementation group: 'xerces', name: 'xercesImpl', version: '2.11.0'
    implementation group: 'com.lowagie', name: 'itext', version: '2.1.7'
    implementation group: 'org.mapfish.print', name: 'print-lib', version: '3.15.0'

    // Microsoft Teams
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // JasperReports
    implementation 'net.sf.jasperreports:jasperreports:6.20.0'
    implementation 'mysql:mysql-connector-java:8.0.33'
    implementation 'net.sf.jasperreports:jasperreports-fonts:6.20.0'

    // JavaFX (comenta si no lo necesitas)
    // implementation 'org.openjfx:javafx-controls:17.0.1'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
        mavenBom "org.springframework.data:spring-data-bom:${springCloudVersion}"
    }
}

jar {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            '-Amapstruct.defaultComponentModel=spring'
    ]
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}