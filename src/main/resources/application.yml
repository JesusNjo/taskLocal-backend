server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tasklocal_db?useSSL=false&serverTimezone=UTC
    username: root
    password: mysql123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        # Configuraciones específicas para MySQL
        jdbc:
          time_zone: UTC
        # Para evitar problemas con grupos SQL
        sql:
          init:
            mode: always

  # Configuración específica de MySQL
  sql:
    init:
      platform: mysql

# JWT Configuration
jwt:
  secret: mySecretKeyForJWTGenerationInProductionChangeThis
  expiration: 86400000 # 24 hours

# Logging
logging:
  level:
    com.tasklocal: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE