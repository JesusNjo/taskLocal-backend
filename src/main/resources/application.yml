server:
  port: ${PORT:8080} # Puerto más común para desarrollo
  servlet:
    context-path: /

spring:
  application:
    name: reservation_app-backend
  profiles:
    active: ${ENVIRONMENT:local}

  # Configuración principal de la base de datos
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/reservation_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PWD:mysql123}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: TaskLocalHikariCP
      connection-timeout: 30000
      maximum-lifetime: 1800000

  # Configuración de JPA y Hibernate
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        #Dialect changing because: http://in.relation.to/2017/02/20/mysql-dialect-refactoring/
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        enable_lazy_load_no_trans: true
        generate_statistics: false
      jakarta:
        persistence:
          shared-cache-mode: ENABLE_SELECTIVE
          jpa:
            open-in-view: false
    open-in-view: false

  # Configuración de Liquibase
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${ENVIRONMENT:local}
    default-schema: reservation_app

  # Configuración de archivos multipart
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Configuración de seguridad SIMPLIFICADA (sin Keycloak)
  security:
    oauth2:
      resourceserver:
        jwt:
        # Comentado porque no usas Keycloak. Descomenta y configura si añades Auth0, Cognito, etc.
        # issuer-uri: ${JWT_ISSUER_URI}
    # Opcional: Para deshabilitar la seguridad completamente en desarrollo
    # enabled: false

  # Jackson (JSON)
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    deserialization:
      adjust-dates-to-context-time-zone: false

# Configuración de AWS (usa variables de entorno para las credenciales)
cloud:
  aws:
    region:
      static: ${AWS_REGION:us-east-1}
      auto: false
    stack:
      auto: false
    credentials:
      accessKey: AKIA5G2VGIVHKOWKAHV3
      secretKey: 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

# Configuración de CORS para desarrollo
global-cors:
  cors-configurations:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
    allowed-credentials: true
    allowed-headers: "*"
    allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
    max-age: 3600

# Configuración de logging
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.example.backend: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/reservation_app-backend.log